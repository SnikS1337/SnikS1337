<svg width="840" height="280" viewBox="0 0 840 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Precision signal</title>
  <desc id="desc">A graphite instrument with an amber needle and a waveform shaped by real GitHub activity.</desc>
  <defs>
    <style>
      .needle { animation: sweep 12s cubic-bezier(.45,0,.55,1) infinite; transform-origin: 190px 140px; }
      .wave-run { stroke-dasharray: 14 86; animation: wave-run 12s linear infinite; }
      @keyframes sweep { 0%, 100% { transform: rotate(-68deg); } 50% { transform: rotate(68deg); } }
      @keyframes wave-run { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .needle, .wave-run { animation: none; }
        .needle { transform: rotate(18deg); }
        .wave-run { stroke-dashoffset: 46; }
      }
    </style>
    <linearGradient id="metal" x1="104" y1="52" x2="276" y2="228" gradientUnits="userSpaceOnUse">
      <stop stop-color="#30363D"/>
      <stop offset="0.48" stop-color="#161B22"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="face" x1="146" y1="96" x2="234" y2="184" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#30363D" fill-opacity="0.42"/>
    </pattern>
  </defs>
