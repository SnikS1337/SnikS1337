<svg width="1280" height="480" viewBox="0 0 1280 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Living aurora glass</title>
  <desc id="desc">Animated violet and cyan light ribbons, drifting particles and a glass horizon.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070914"/>
      <stop offset="0.32" stop-color="#151033"/>
      <stop offset="0.68" stop-color="#081726"/>
      <stop offset="1" stop-color="#070914"/>
    </linearGradient>
    <radialGradient id="violetHalo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(310 150) rotate(12) scale(500 320)">
      <stop stop-color="#8B5CF6" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanHalo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 160) rotate(-14) scale(520 330)">
      <stop stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkHalo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(680 400) scale(460 220)">
      <stop stop-color="#F0ABFC" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F0ABFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="120" y1="330" x2="1160" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.48" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#F0ABFC"/>
    </linearGradient>
    <linearGradient id="waveSoft" x1="120" y1="350" x2="1160" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="glass" x1="140" y1="64" x2="1120" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="edge" x1="90" y1="58" x2="1190" y2="422" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-70%" width="160%" height="240%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="panelClip">
      <rect x="80" y="60" width="1120" height="360" rx="44"/>
    </clipPath>
    <style>
      .aurora-violet { animation: drift-violet 16s ease-in-out infinite alternate; }
      .aurora-cyan { animation: drift-cyan 20s ease-in-out infinite alternate; }
      .wave-glow { animation: wave-glow 9s ease-in-out infinite alternate; }
      .wave-stream { stroke-dasharray: 180 1500; animation: stream 7s linear infinite; }
      .scan { animation: scan 8s ease-in-out infinite; }
      .orbit { transform-origin: 640px 240px; animation: orbit 28s linear infinite; }
      .particle { opacity: 0; animation: rise var(--dur, 9s) linear infinite; animation-delay: var(--delay, 0s); }
      @keyframes drift-violet { from { transform: translate(-26px, -12px); } to { transform: translate(38px, 22px); } }
      @keyframes drift-cyan { from { transform: translate(24px, 14px); } to { transform: translate(-34px, -20px); } }
      @keyframes wave-glow { from { opacity: 0.2; } to { opacity: 0.42; } }
      @keyframes stream { from { stroke-dashoffset: 1680; } to { stroke-dashoffset: 0; } }
      @keyframes scan { 0% { transform: translateX(-420px); opacity: 0; } 20% { opacity: 0.7; } 80% { opacity: 0.7; } 100% { transform: translateX(420px); opacity: 0; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes rise { 0% { transform: translate(0, 36px); opacity: 0; } 18% { opacity: 0.85; } 100% { transform: translate(var(--drift, 24px), -130px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .aurora-violet, .aurora-cyan, .wave-glow, .wave-stream, .scan, .orbit, .particle { animation: none; }
        .particle { opacity: 0.5; }
      }
    </style>
  </defs>

  <rect width="1280" height="480" rx="32" fill="url(#background)"/>

  <g class="aurora-violet"><ellipse cx="310" cy="150" rx="470" ry="300" fill="url(#violetHalo)"/></g>
  <g class="aurora-cyan"><ellipse cx="1010" cy="160" rx="500" ry="320" fill="url(#cyanHalo)"/></g>
  <ellipse cx="680" cy="400" rx="450" ry="210" fill="url(#pinkHalo)"/>

  <g class="orbit" opacity="0.22">
    <ellipse cx="640" cy="240" rx="470" ry="176" stroke="url(#wave)" stroke-width="1" stroke-dasharray="3 12"/>
    <circle cx="1110" cy="240" r="4" fill="#67E8F9"/>
  </g>

  <g>
    <circle class="particle" style="--delay:-1s;--dur:8s;--drift:28px" cx="168" cy="330" r="2" fill="#C4B5FD"/>
    <circle class="particle" style="--delay:-4s;--dur:11s;--drift:-18px" cx="264" cy="390" r="1.4" fill="#A5F3FC"/>
    <circle class="particle" style="--delay:-7s;--dur:9s;--drift:34px" cx="352" cy="300" r="1.8" fill="#F5D0FE"/>
    <circle class="particle" style="--delay:-2s;--dur:12s;--drift:-24px" cx="448" cy="410" r="1.3" fill="#C4B5FD"/>
    <circle class="particle" style="--delay:-6s;--dur:10s;--drift:20px" cx="548" cy="350" r="2" fill="#A5F3FC"/>
    <circle class="particle" style="--delay:-3s;--dur:9s;--drift:-30px" cx="650" cy="420" r="1.5" fill="#F5D0FE"/>
    <circle class="particle" style="--delay:-8s;--dur:13s;--drift:26px" cx="748" cy="330" r="1.7" fill="#C4B5FD"/>
    <circle class="particle" style="--delay:-5s;--dur:10s;--drift:-22px" cx="852" cy="400" r="1.2" fill="#A5F3FC"/>
    <circle class="particle" style="--delay:-1s;--dur:11s;--drift:32px" cx="948" cy="310" r="2" fill="#F5D0FE"/>
    <circle class="particle" style="--delay:-7s;--dur:9s;--drift:-16px" cx="1050" cy="390" r="1.4" fill="#C4B5FD"/>
    <circle class="particle" style="--delay:-4s;--dur:12s;--drift:24px" cx="1140" cy="340" r="1.8" fill="#A5F3FC"/>
    <circle class="particle" style="--delay:-2s;--dur:8s;--drift:-28px" cx="220" cy="250" r="1.2" fill="#F5D0FE"/>
    <circle class="particle" style="--delay:-6s;--dur:10s;--drift:18px" cx="720" cy="250" r="1.3" fill="#C4B5FD"/>
    <circle class="particle" style="--delay:-3s;--dur:11s;--drift:-20px" cx="1010" cy="270" r="1.5" fill="#A5F3FC"/>
  </g>

  <rect x="56" y="42" width="1168" height="396" rx="54" fill="#0B0E22" fill-opacity="0.3" stroke="#A78BFA" stroke-opacity="0.1"/>
  <rect x="80" y="60" width="1120" height="360" rx="44" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.3"/>

  <g clip-path="url(#panelClip)">
    <path d="M20 352C250 150 420 402 642 246C864 90 1010 366 1260 188" stroke="url(#waveSoft)" stroke-width="92" stroke-linecap="round" opacity="0.24" filter="url(#blur)" class="wave-glow"/>
    <path d="M20 352C250 150 420 402 642 246C864 90 1010 366 1260 188" stroke="url(#wave)" stroke-width="42" stroke-linecap="round" opacity="0.38" filter="url(#glow)" class="wave-glow"/>
    <path d="M20 352C250 150 420 402 642 246C864 90 1010 366 1260 188" stroke="url(#wave)" stroke-width="2.4" stroke-linecap="round" opacity="0.96"/>
    <path d="M20 352C250 150 420 402 642 246C864 90 1010 366 1260 188" stroke="#E0F2FE" stroke-width="2.4" stroke-linecap="round" opacity="0.8" class="wave-stream"/>
    <rect class="scan" x="240" y="60" width="220" height="360" fill="url(#scan)" transform="skewX(-18)"/>
    <path d="M120 84H1160" stroke="#FFFFFF" stroke-opacity="0.12"/>
  </g>

  <rect x="80.7" y="60.7" width="1118.6" height="358.6" rx="43.3" stroke="#FFFFFF" stroke-opacity="0.06"/>
</svg>
