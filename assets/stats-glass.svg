<svg width="1100" height="240" viewBox="0 0 1100 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub statistics</title>
  <desc id="desc">862 contributions, 10 repositories and 6 stars on dark glass panels.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="340" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="340" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="accent" x1="40" y1="170" x2="300" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip0"><rect x="20" y="20" width="340" height="200" rx="28"/></clipPath>
    <clipPath id="clip1"><rect x="380" y="20" width="340" height="200" rx="28"/></clipPath>
    <clipPath id="clip2"><rect x="740" y="20" width="340" height="200" rx="28"/></clipPath>
    <style>
      .panel { animation: panel-in 700ms cubic-bezier(.2,.8,.2,1) both; }
      .p1 { animation-delay: 80ms; }
      .p2 { animation-delay: 180ms; }
      .p3 { animation-delay: 280ms; }
      .sheen { animation: sheen 7s ease-in-out infinite; }
      .s2 { animation-delay: -2.3s; }
      .s3 { animation-delay: -4.6s; }
      .pulse { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 2.4s ease-out 500ms forwards; }
      .bar { transform-origin: left; animation: bar-in 900ms cubic-bezier(.2,.8,.2,1) 650ms both; }
      .b2 { animation-delay: 780ms; }
      .b3 { animation-delay: 910ms; }
      @keyframes panel-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes sheen { 0%, 100% { transform: translateX(-170px); opacity: 0; } 50% { transform: translateX(170px); opacity: 0.65; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes bar-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        .panel, .sheen, .pulse, .bar { animation: none; }
        .pulse { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <g class="panel p1">
    <rect x="20" y="20" width="340" height="200" rx="28" fill="#0B0E22" fill-opacity="0.88" stroke="url(#edge)" stroke-width="1.2"/>
    <rect x="21" y="21" width="338" height="198" rx="27" fill="url(#panel)"/>
    <text x="48" y="78" fill="#C4B5FD" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="500" letter-spacing="2">CONTRIBUTIONS</text>
    <text x="46" y="146" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="62" font-weight="500" letter-spacing="-2">862</text>
    <path class="pulse" d="M48 184H78L92 168L108 190L126 154L146 178L166 164L186 188L208 158L228 176L248 150L268 182L292 166L312 184" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g clip-path="url(#clip0)"><rect class="sheen" x="90" y="20" width="120" height="200" fill="url(#sheen)" transform="skewX(-18)"/></g>
  </g>

  <g class="panel p2">
    <rect x="380" y="20" width="340" height="200" rx="28" fill="#0B0E22" fill-opacity="0.88" stroke="url(#edge)" stroke-width="1.2"/>
    <rect x="381" y="21" width="338" height="198" rx="27" fill="url(#panel)"/>
    <text x="408" y="78" fill="#C4B5FD" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="500" letter-spacing="2">REPOSITORIES</text>
    <text x="406" y="146" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="62" font-weight="500" letter-spacing="-2">10</text>
    <g class="bar">
      <rect x="480" y="104" width="188" height="8" rx="4" fill="#A78BFA" fill-opacity="0.16"/>
      <rect x="480" y="104" width="132" height="8" rx="4" fill="url(#accent)"/>
      <rect x="480" y="124" width="164" height="8" rx="4" fill="#A78BFA" fill-opacity="0.16"/>
      <rect x="480" y="124" width="104" height="8" rx="4" fill="#67E8F9" fill-opacity="0.78"/>
      <rect x="480" y="144" width="208" height="8" rx="4" fill="#A78BFA" fill-opacity="0.16"/>
      <rect x="480" y="144" width="152" height="8" rx="4" fill="#A78BFA" fill-opacity="0.72"/>
      <rect x="480" y="164" width="176" height="8" rx="4" fill="#A78BFA" fill-opacity="0.16"/>
      <rect x="480" y="164" width="88" height="8" rx="4" fill="#67E8F9" fill-opacity="0.52"/>
    </g>
    <g clip-path="url(#clip1)"><rect class="sheen s2" x="450" y="20" width="120" height="200" fill="url(#sheen)" transform="skewX(-18)"/></g>
  </g>

  <g class="panel p3">
    <rect x="740" y="20" width="340" height="200" rx="28" fill="#0B0E22" fill-opacity="0.88" stroke="url(#edge)" stroke-width="1.2"/>
    <rect x="741" y="21" width="338" height="198" rx="27" fill="url(#panel)"/>
    <text x="768" y="78" fill="#C4B5FD" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="500" letter-spacing="2">STARS</text>
    <text x="766" y="146" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="62" font-weight="500" letter-spacing="-2">6</text>
    <g class="bar b3" stroke="url(#accent)" stroke-width="2" stroke-linejoin="round">
      <path d="M856 108L861.8 122.2L877 123.2L865.5 133.5L868.6 148.5L856 141L843.4 148.5L846.5 133.5L835 123.2L850.2 122.2L856 108Z"/>
      <path d="M920 116L923.8 126.2L934.8 126.9L926.4 134.5L928.7 145.2L920 139.6L911.3 145.2L913.6 134.5L905.2 126.9L916.2 126.2L920 116Z" opacity="0.72"/>
      <path d="M984 108L989.8 122.2L1005 123.2L993.5 133.5L996.6 148.5L984 141L971.4 148.5L974.5 133.5L963 123.2L978.2 122.2L984 108Z"/>
      <path d="M1018 132L1021.8 142.2L1032.8 142.9L1024.4 150.5L1026.7 161.2L1018 155.6L1009.3 161.2L1011.6 150.5L1003.2 142.9L1014.2 142.2L1018 132Z" opacity="0.55"/>
    </g>
    <g clip-path="url(#clip2)"><rect class="sheen s3" x="810" y="20" width="120" height="200" fill="url(#sheen)" transform="skewX(-18)"/></g>
  </g>
</svg>
